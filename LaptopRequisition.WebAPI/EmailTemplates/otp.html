<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .header { background-color: #007bff; color: #ffffff; padding: 10px 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; text-align: center; }
        .otp-code { font-size: 32px; font-weight: bold; color: #007bff; margin: 20px 0; padding: 10px; border: 2px dashed #007bff; display: inline-block; letter-spacing: 5px; }
        .purpose { font-size: 18px; color: #555555; margin-bottom: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #888888; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Secure Authentication</h2>
        </div>
        <div class="content">
            <p class="purpose">Your One-Time Password (OTP) for {{purpose}} is:</p>
            <div class="otp-code">{{otp}}</div>
            <p>This code is valid for 5 minutes.</p>
            <p>If you did not request this, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; {{currentYear}} Laptop Requisition System. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
